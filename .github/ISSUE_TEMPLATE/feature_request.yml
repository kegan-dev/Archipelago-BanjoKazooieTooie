name: Idea or request
description: A setting, a quality-of-life change, or something you'd like the world to do.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you'd like, and what it would make better.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: How it might work, or how another Archipelago game does it.
